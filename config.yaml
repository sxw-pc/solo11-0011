project:
  name: 表链测绘仪
  version: "1.0.0"

sources:
  csv_dirs:
    - fixtures/mock_csv
  sqlite_files:
    - fixtures/mock_sqlite/env_monitor.db
  csv_encodings:
    - utf-8-sig
    - utf-8
    - gbk
  include_tables: []
  exclude_tables:
    - tmp_*
    - temp_*
    - sqlite_*
  exclude_fields: []

explicit:
  naming:
    enabled: true
    suffixes:
      - _id
    min_overlap_ratio: 0.3
    min_matched_values: 3
    confidence: 0.84
    table_name_confidence: 0.90
    synonym_map:
      device:
        - sensor
        - equipment
        - terminal
      room:
        - area
        - zone
        - site
      engineer:
        - technician
        - staff
      alarm:
        - alert
        - warning
  custom_rules_path: fixtures/custom_rules/user_rules.yaml

overlap:
  threshold: 0.70
  same_table: false
  min_matched_values: 3
  max_cardinality_ratio: 0.80
  allow_reference_high_cardinality: true
  min_nonnull_ratio: 0.20
  strict_type: true
  weights:
    value: 0.60
    name: 0.25
    synonym: 0.15
  max_pairs: 5000
  evidence_limit: 5

fd:
  enabled: true
  min_rows: 10
  confidence_threshold: 0.90
  complete_threshold: 0.999
  max_source_cardinality_ratio: 1.0
  max_target_cardinality_ratio: 0.50
  cross_table: true
  max_per_table: 8

incremental:
  confidence_delta_threshold: 0.05
  default_baseline: fixtures/expected_output/history_relations.json

output:
  directory: output
  rules_json: relations.json
  rules_yaml: relations.yaml
  report_md: report.md
  graph_html: graph.html
  graph_json: graph.json

report:
  high_confidence: 0.90

# 主题域自动划分（默认关闭，不影响任何既有产物）。
# 开启后基于表级加权边做确定性聚类，输出域、跨域桥接表与未分组清单。
domain:
  enabled: false
  # 表级边权重阈值：同表对关联边的 置信度×关系类型权重 之和达到该值才算强边
  edge_weight_threshold: 0.55
  # 单个主题域的最大表数量，超出后按最弱内边确定性切分
  max_domain_size: 25
  # 一张表的强邻接至少覆盖几个域级分量才会被判定为跨域边界表
  bridge_min_domains: 2
  # 次强域权重达到最强域的该比例才标注为桥接表，否则归入未分组，防止偶然弱边误判
  bridge_balance_ratio: 0.65
  # 关系类型权重：显式/人工关联权重最高，函数依赖仅作弱信号
  relation_weights:
    custom: 1.0
    explicit_fk: 1.0
    explicit_naming: 0.9
    value_overlap: 0.7
    functional_dependency: 0.3

web:
  host: 127.0.0.1
  port: 5000
  debug: false
  auto_reload: true
